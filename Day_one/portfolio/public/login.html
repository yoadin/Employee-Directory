<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <section class="login-container" id="login">

    <h2>Login</h2>

    <form id="loginForm">

        <input 
            type="text" 
            id="username"
            placeholder="Username"
            required
        >

        <input 
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="loginMessage"></p>

</section>

<script src="login.js"></script>
</body>
</html>
